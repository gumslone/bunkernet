[platformio]
src_dir = firmware/bunkernet
default_envs = esp01_1m

[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -Wall
board_build.filesystem = littlefs

; ESP-01 / ESP-01S, 1 MB flash (128 KB reserved for the filesystem that holds stored messages)
[env:esp01_1m]
board = esp01_1m
board_build.ld_script = eagle.flash.1m128.ld

; Same hardware, relay only: no access point and no web server. Use it to extend range
; where nobody needs to connect. It still holds and forwards stored messages.
[env:esp01_relay]
board = esp01_1m
board_build.ld_script = eagle.flash.1m128.ld
build_flags = ${env.build_flags} -DRELAY_ONLY=1 -Wno-unused-function

[env:nodemcuv2]
board = nodemcuv2
